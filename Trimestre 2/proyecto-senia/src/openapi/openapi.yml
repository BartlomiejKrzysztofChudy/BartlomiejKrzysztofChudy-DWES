    get:
      tags:
        - Student - Logros
      summary: Logros obtenidos por el estudiante
      description: Obtiene todos los logros conseguidos por el estudiante
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de logros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAchievement'
        '401':
          description: No autenticado
        '403':
          description: No autorizado
