openapi: 3.0.0
info:
  title: Sistema de Gestión Educativa - SENIA
  version: 1.0.0
  description: |
    API REST para el sistema de gestión educativa que permite administrar usuarios, cursos, 
    asignaturas, matrículas, calificaciones y asistencias.
  contact:
    name: Soporte API
    email: soporte@senia.edu

servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo local (Docker)
  - url: https://bartlomiejkrzysztofchudy-dwes-1.onrender.com
    description: Servidor de producción (Render)

tags:
  - name: Autenticación
    description: Endpoints de autenticación y autorización
  - name: Admin - Usuarios
    description: Gestión de usuarios por administradores
  - name: Admin - Cursos
    description: Gestión de cursos por administradores
  - name: Admin - Asignaturas
    description: Gestión de asignaturas por administradores
  - name: Admin - Matrículas
    description: Gestión de matrículas por administradores
  - name: Admin - Horarios
    description: Gestión de horarios por administradores
  - name: Teacher - Dashboard
    description: Panel principal del profesor
  - name: Teacher - Asistencia
    description: Gestión de asistencias por profesores
  - name: Teacher - Evaluaciones
    description: Gestión de evaluaciones por profesores
  - name: Teacher - Items de Evaluación
    description: Gestión de items de evaluación por profesores
  - name: Teacher - Calificaciones
    description: Gestión de calificaciones por profesores
  - name: Teacher - Resumen
    description: Resumen de calificaciones por profesor
  - name: Student - Dashboard
    description: Panel principal y progreso del estudiante
  - name: Student - Asignaturas
    description: Consulta de asignaturas del estudiante
  - name: Student - Asistencia
    description: Consulta de asistencias del estudiante
  - name: Student - Calificaciones
    description: Consulta de calificaciones del estudiante
  - name: Student - Logros
    description: Sistema de logros y gamificación

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido del endpoint /auth/login

  schemas:
    User:
      type: object
      required:
        - name
        - email
        - password
        - role
      properties:
        _id:
          type: string
          example: "697f82c7d7caa6b6652a85ec"
        name:
          type: string
          example: "Juan Pérez"
        email:
          type: string
          format: email
          example: "juan.perez@ejemplo.com"
        password:
          type: string
          format: password
          example: "password123"
        role:
          type: string
          enum: [ADMIN, TEACHER, STUDENT]
          example: "STUDENT"
        active:
          type: boolean
          default: true
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserResponse:
      type: object
      properties:
        _id:
          type: string
          example: "697f82c7d7caa6b6652a85ec"
        name:
          type: string
          example: "Juan Pérez"
        email:
          type: string
          example: "juan.perez@ejemplo.com"
        role:
          type: string
          example: "STUDENT"
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Course:
      type: object
      required:
        - name
      properties:
        _id:
          type: string
          example: "697f9c3f1405658893cdb69b"
        name:
          type: string
          example: "1º DAW"
        active:
          type: boolean
          default: true
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Subject:
      type: object
      required:
        - name
        - course
        - teacher
        - type
      properties:
        _id:
          type: string
          example: "697f9c3f1405658893cdb69c"
        name:
          type: string
          example: "Desarrollo Web en Entorno Servidor"
        course:
          type: string
          description: ID del curso
          example: "697f9c3f1405658893cdb69b"
        teacher:
          type: string
          description: ID del profesor
          example: "697f82c7d7caa6b6652a85ed"
        type:
          type: string
          enum: [TRONCAL, OPTATIVA]
          example: "TRONCAL"
        active:
          type: boolean
          default: true
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SubjectPopulated:
      type: object
      properties:
        _id:
          type: string
          example: "697f9c3f1405658893cdb69c"
        name:
          type: string
          example: "Desarrollo Web en Entorno Servidor"
        course:
          $ref: '#/components/schemas/Course'
        teacher:
          $ref: '#/components/schemas/UserResponse'
        type:
          type: string
          example: "TRONCAL"
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Enrollment:
      type: object
      required:
        - student
        - subject
      properties:
        _id:
          type: string
          example: "697f9c3f1405658893cdb69d"
        student:
          type: string
          description: ID del estudiante
          example: "697f82c7d7caa6b6652a85ec"
        subject:
          type: string
          description: ID de la asignatura
          example: "697f9c3f1405658893cdb69c"
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean
          default: true
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EnrollmentPopulated:
      type: object
      properties:
        _id:
          type: string
          example: "697f9c3f1405658893cdb69d"
        student:
          $ref: '#/components/schemas/UserResponse'
        subject:
          $ref: '#/components/schemas/SubjectPopulated'
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "admin@ejemplo.com"
        password:
          type: string
          format: password
          example: "password123"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          $ref: '#/components/schemas/UserResponse'

    Error:
      type: object
      properties:
        error:
          type: string
          example: "Mensaje de error"
        message:
          type: string
          example: "Descripción detallada del error"

    Attendance:
      type: object
      required:
        - student
        - subject
        - date
        - status
        - createdBy
      properties:
        _id:
          type: string
          example: "697f9c3f1405658893cdb69e"
        student:
          type: string
          description: ID del estudiante
          example: "697f82c7d7caa6b6652a85ec"
        subject:
          type: string
          description: ID de la asignatura
          example: "697f9c3f1405658893cdb69c"
        date:
          type: string
          format: date
          example: "2026-02-02"
        status:
          type: string
          enum: [PRESENT, ABSENT, LATE]
          example: "PRESENT"
        createdBy:
          type: string
          description: ID del profesor que registró la asistencia
          example: "697f82c7d7caa6b6652a85ed"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AttendancePopulated:
      type: object
      properties:
        _id:
          type: string
          example: "697f9c3f1405658893cdb69e"
        student:
          $ref: '#/components/schemas/UserResponse'
        subject:
          $ref: '#/components/schemas/SubjectPopulated'
        date:
          type: string
          format: date
        status:
          type: string
          example: "PRESENT"
        createdBy:
          $ref: '#/components/schemas/UserResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Evaluation:
      type: object
      required:
        - subject
        - name
        - order
      properties:
        _id:
          type: string
          example: "69805f1ffad12f59ee5c7083"
        subject:
          type: string
          description: ID de la asignatura
          example: "697f9c3f1405658893cdb69c"
        name:
          type: string
          example: "1ª Evaluación"
        order:
          type: number
          example: 1
        active:
          type: boolean
          default: true
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EvaluationItem:
      type: object
      required:
        - evaluation
        - name
        - type
        - weight
      properties:
        _id:
          type: string
          example: "698061a496e682f4680dc5bf"
        evaluation:
          type: string
          description: ID de la evaluación
          example: "69805f1ffad12f59ee5c7083"
        name:
          type: string
          example: "Examen Tema 1"
        type:
          type: string
          enum: [EXAM, PRACTICE, PROJECT, ATTITUDE, CUSTOM]
          example: "EXAM"
        weight:
          type: number
          minimum: 0
          maximum: 100
          example: 40
        active:
          type: boolean
          default: true
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Grade:
      type: object
      required:
        - evaluationItem
        - student
        - value
      properties:
        _id:
          type: string
          example: "698061a496e682f4680dc5c0"
        evaluationItem:
          type: string
          description: ID del item de evaluación
          example: "698061a496e682f4680dc5bf"
        student:
          type: string
          description: ID del estudiante
          example: "697f82c7d7caa6b6652a85ec"
        value:
          type: number
          minimum: 0
          maximum: 10
          example: 8.5
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GradePopulated:
      type: object
      properties:
        _id:
          type: string
          example: "698061a496e682f4680dc5c0"
        evaluationItem:
          $ref: '#/components/schemas/EvaluationItem'
        student:
          $ref: '#/components/schemas/UserResponse'
        value:
          type: number
          example: 8.5
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Achievement:
      type: object
      required:
        - name
        - description
      properties:
        _id:
          type: string
          example: "6980a1b2c3d4e5f6a7b8c9d0"
        name:
          type: string
          example: "Primera Evaluación"
        description:
          type: string
          example: "Completaste tu primera evaluación"
        icon:
          type: string
          example: "🏆"
        active:
          type: boolean
          default: true
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserAchievement:
      type: object
      properties:
        _id:
          type: string
          example: "6980a1b2c3d4e5f6a7b8c9d1"
        user:
          type: string
          description: ID del usuario
          example: "697f82c7d7caa6b6652a85ec"
        achievement:
          $ref: '#/components/schemas/Achievement'
        achievedAt:
          type: string
          format: date-time
          example: "2026-02-01T10:00:00.000Z"

paths:
  /auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión
      description: Autentica un usuario y devuelve un token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/admin-test:
    get:
      tags:
        - Autenticación
      summary: Ruta de prueba para administradores
      description: Endpoint de prueba que solo puede ser accedido por usuarios con rol ADMIN
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Acceso exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Solo ADMIN puede ver esto"
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No autorizado (no es ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/users:
    post:
      tags:
        - Admin - Usuarios
      summary: Crear nuevo usuario
      description: Crea un nuevo usuario en el sistema (Solo ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - role
              properties:
                name:
                  type: string
                  example: "María González"
                email:
                  type: string
                  format: email
                  example: "maria.gonzalez@ejemplo.com"
                password:
                  type: string
                  format: password
                  example: "password123"
                role:
                  type: string
                  enum: [ADMIN, TEACHER, STUDENT]
                  example: "TEACHER"
      responses:
        '201':
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El email ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags:
        - Admin - Usuarios
      summary: Obtener lista de usuarios
      description: Obtiene todos los usuarios del sistema con paginación (Solo ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Número de página
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Cantidad de resultados por página
        - in: query
          name: role
          schema:
            type: string
            enum: [ADMIN, TEACHER, STUDENT]
          description: Filtrar por rol
        - in: query
          name: active
          schema:
            type: boolean
          description: Filtrar por estado activo
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResponse'
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 50
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 10
                      pages:
                        type: integer
                        example: 5
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/courses:
    post:
      tags:
        - Admin - Cursos
      summary: Crear nuevo curso
      description: Crea un nuevo curso en el sistema (Solo ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "2º DAW"
                active:
                  type: boolean
                  example: true
      responses:
        '201':
          description: Curso creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El curso ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags:
        - Admin - Cursos
      summary: Obtener lista de cursos
      description: Obtiene todos los cursos del sistema (Solo ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: active
          schema:
            type: boolean
          description: Filtrar por estado activo
      responses:
        '200':
          description: Lista de cursos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/subjects:
    post:
      tags:
        - Admin - Asignaturas
      summary: Crear nueva asignatura
      description: Crea una nueva asignatura en el sistema (Solo ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - course
                - teacher
                - type
              properties:
                name:
                  type: string
                  example: "Desarrollo Web en Entorno Servidor"
                course:
                  type: string
                  description: ID del curso
                  example: "697f9c3f1405658893cdb69b"
                teacher:
                  type: string
                  description: ID del profesor
                  example: "697f82c7d7caa6b6652a85ed"
                type:
                  type: string
                  enum: [TRONCAL, OPTATIVA]
                  example: "TRONCAL"
                active:
                  type: boolean
                  example: true
      responses:
        '201':
          description: Asignatura creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Curso o profesor no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: La asignatura ya existe para ese curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/subjects/course/{courseId}:
    get:
      tags:
        - Admin - Asignaturas
      summary: Obtener asignaturas por curso
      description: Obtiene todas las asignaturas de un curso específico (Solo ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: string
          description: ID del curso
          example: "697f9c3f1405658893cdb69b"
        - in: query
          name: active
          schema:
            type: boolean
          description: Filtrar por estado activo
        - in: query
          name: type
          schema:
            type: string
            enum: [TRONCAL, OPTATIVA]
          description: Filtrar por tipo de asignatura
      responses:
        '200':
          description: Lista de asignaturas del curso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubjectPopulated'
        '400':
          description: ID de curso inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Curso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/enrollments:
    post:
      tags:
        - Admin - Matrículas
      summary: Matricular estudiante
      description: Matricula un estudiante en una asignatura (Solo ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - student
                - subject
              properties:
                student:
                  type: string
                  description: ID del estudiante
                  example: "697f82c7d7caa6b6652a85ec"
                subject:
                  type: string
                  description: ID de la asignatura
                  example: "697f9c3f1405658893cdb69c"
                startDate:
                  type: string
                  format: date-time
                  example: "2026-02-01T00:00:00.000Z"
      responses:
        '201':
          description: Matrícula creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Estudiante o asignatura no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El estudiante ya está matriculado en esta asignatura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/enrollments/subject/{subjectId}:
    get:
      tags:
        - Admin - Matrículas
      summary: Obtener matrículas por asignatura
      description: Obtiene todas las matrículas de una asignatura específica (Solo ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: subjectId
          required: true
          schema:
            type: string
          description: ID de la asignatura
          example: "697f9c3f1405658893cdb69c"
        - in: query
          name: active
          schema:
            type: boolean
          description: Filtrar por matrículas activas
      responses:
        '200':
          description: Lista de matrículas de la asignatura
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrollmentPopulated'
        '400':
          description: ID de asignatura inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Asignatura no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== TEACHER ENDPOINTS ====================
  
  /teacher/dashboard:
    get:
      tags:
        - Teacher - Dashboard
      summary: Dashboard del profesor
      description: Obtiene las asignaturas asignadas al profesor con información del curso
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard del profesor
          content:
            application/json:
              schema:
                type: object
                properties:
                  subjects:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubjectPopulated'
        '401':
          description: No autenticado
        '403':
          description: No autorizado (Solo TEACHER)

  /teacher/subjects/{subjectId}/attendance:
    get:
      tags:
        - Teacher - Asistencia
      summary: Obtener asistencias de una asignatura
      description: Obtiene todas las asistencias registradas para una asignatura (Solo TEACHER)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: subjectId
          required: true
          schema:
            type: string
          description: ID de la asignatura
          example: "697f9c3f1405658893cdb69c"
        - in: query
          name: date
          schema:
            type: string
            format: date
          description: Filtrar por fecha específica
        - in: query
          name: status
          schema:
            type: string
            enum: [PRESENT, ABSENT, LATE]
          description: Filtrar por estado
      responses:
        '200':
          description: Lista de asistencias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendancePopulated'
        '401':
          description: No autenticado
        '403':
          description: No autorizado
        '404':
          description: Asignatura no encontrada

    post:
      tags:
        - Teacher - Asistencia
      summary: Registrar asistencias
      description: Registra la asistencia de estudiantes para una fecha específica (Solo TEACHER)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: subjectId
          required: true
          schema:
            type: string
          description: ID de la asignatura
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - date
                - attendances
              properties:
                date:
                  type: string
                  format: date
                  example: "2026-02-02"
                attendances:
                  type: array
                  items:
                    type: object
                    required:
                      - student
                      - status
                    properties:
                      student:
                        type: string
                        example: "697f82c7d7caa6b6652a85ec"
                      status:
                        type: string
                        enum: [PRESENT, ABSENT, LATE]
                        example: "PRESENT"
      responses:
        '201':
          description: Asistencias registradas exitosamente
        '400':
          description: Datos inválidos
        '401':
          description: No autenticado
        '403':
          description: No autorizado

  /teacher/subjects/{subjectId}/attendance/summary:
    get:
      tags:
        - Teacher - Asistencia
      summary: Resumen de asistencias
      description: Obtiene un resumen estadístico de las asistencias de la asignatura (Solo TEACHER)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: subjectId
          required: true
          schema:
            type: string
          description: ID de la asignatura
      responses:
        '200':
          description: Resumen de asistencias
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalClasses:
                    type: number
                    example: 20
                  students:
                    type: array
                    items:
                      type: object
                      properties:
                        student:
                          $ref: '#/components/schemas/UserResponse'
                        present:
                          type: number
                          example: 18
                        absent:
                          type: number
                          example: 2
                        late:
                          type: number
                          example: 0
                        percentage:
                          type: number
                          example: 90
        '401':
          description: No autenticado
        '403':
          description: No autorizado

  /teacher/subjects/{subjectId}/evaluations:
    get:
      tags:
        - Teacher - Evaluaciones
      summary: Obtener evaluaciones de una asignatura
      description: Lista todas las evaluaciones de una asignatura (Solo TEACHER)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: subjectId
          required: true
          schema:
            type: string
          description: ID de la asignatura
        - in: query
          name: active
          schema:
            type: boolean
          description: Filtrar por evaluaciones activas
      responses:
        '200':
          description: Lista de evaluaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evaluation'
        '401':
          description: No autenticado
        '403':
          description: No autorizado

    post:
      tags:
        - Teacher - Evaluaciones
      summary: Crear evaluación
      description: Crea una nueva evaluación para la asignatura (Solo TEACHER)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: subjectId
          required: true
          schema:
            type: string
          description: ID de la asignatura
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - order
              properties:
                name:
                  type: string
                  example: "1ª Evaluación"
                order:
                  type: number
                  example: 1
      responses:
        '201':
          description: Evaluación creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
        '400':
          description: Datos inválidos
        '401':
          description: No autenticado
        '403':
          description: No autorizado

  /teacher/evaluations/{evaluationId}/items:
    get:
      tags:
        - Teacher - Items de Evaluación
      summary: Obtener items de evaluación
      description: Lista todos los items de una evaluación (Solo TEACHER)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: evaluationId
          required: true
          schema:
            type: string
          description: ID de la evaluación
      responses:
        '200':
          description: Lista de items de evaluación
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvaluationItem'
        '401':
          description: No autenticado
        '403':
          description: No autorizado

    post:
      tags:
        - Teacher - Items de Evaluación
      summary: Crear item de evaluación
      description: Crea un nuevo item de evaluación (examen, práctica, etc.) (Solo TEACHER)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: evaluationId
          required: true
          schema:
            type: string
          description: ID de la evaluación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
                - weight
              properties:
                name:
                  type: string
                  example: "Examen Tema 1"
                type:
                  type: string
                  enum: [EXAM, PRACTICE, PROJECT, ATTITUDE, CUSTOM]
                  example: "EXAM"
                weight:
                  type: number
                  minimum: 0
                  maximum: 100
                  example: 40
                  description: Peso del item en la evaluación (%)
      responses:
        '201':
          description: Item de evaluación creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationItem'
        '400':
          description: Datos inválidos (suma de pesos > 100%)
        '401':
          description: No autenticado
        '403':
          description: No autorizado

  /teacher/evaluations/items/{itemId}/grades:
    get:
      tags:
        - Teacher - Calificaciones
      summary: Obtener calificaciones de un item
      description: Lista todas las calificaciones de un item de evaluación (Solo TEACHER)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
          description: ID del item de evaluación
          example: "698061a496e682f4680dc5bf"
      responses:
        '200':
          description: Lista de calificaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GradePopulated'
        '401':
          description: No autenticado
        '403':
          description: No autorizado

    post:
      tags:
        - Teacher - Calificaciones
      summary: Establecer calificación
      description: Establece o actualiza la calificación de un estudiante en un item (Solo TEACHER)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
          description: ID del item de evaluación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - student
                - value
              properties:
                student:
                  type: string
                  description: ID del estudiante
                  example: "697f82c7d7caa6b6652a85ec"
                value:
                  type: number
                  minimum: 0
                  maximum: 10
                  example: 8.5
                  description: Nota del estudiante (0-10)
      responses:
        '200':
          description: Calificación establecida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grade'
        '400':
          description: Datos inválidos (nota fuera de rango)
        '401':
          description: No autenticado
        '403':
          description: No autorizado

  /teacher/evaluations/{evaluationId}/grades/summary:
    get:
      tags:
        - Teacher - Calificaciones
      summary: Resumen de calificaciones por evaluación
      description: Obtiene el resumen de calificaciones de todos los estudiantes en una evaluación (Solo TEACHER)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: evaluationId
          required: true
          schema:
            type: string
          description: ID de la evaluación
          example: "69805f1ffad12f59ee5c7083"
      responses:
        '200':
          description: Resumen de calificaciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluation:
                    $ref: '#/components/schemas/Evaluation'
                  students:
                    type: array
                    items:
                      type: object
                      properties:
                        student:
                          $ref: '#/components/schemas/UserResponse'
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              item:
                                $ref: '#/components/schemas/EvaluationItem'
                              grade:
                                type: number
                                nullable: true
                                example: 8.5
                        average:
                          type: number
                          nullable: true
                          example: 7.8
                          description: Nota media ponderada de la evaluación
        '401':
          description: No autenticado
        '403':
          description: No autorizado
        '404':
          description: Evaluación no encontrada

