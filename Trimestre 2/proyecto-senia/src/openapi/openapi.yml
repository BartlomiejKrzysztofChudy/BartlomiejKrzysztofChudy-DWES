    get:
      tags:
        - Student - Asignaturas
      summary: Lista de asignaturas del estudiante
      description: Obtiene todas las asignaturas en las que está matriculado el estudiante
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de asignaturas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubjectPopulated'
        '401':
          description: No autenticado
        '403':
          description: No autorizado

  /student/subjects/{id}:
    get:
      tags:
        - Student - Asignaturas
      summary: Detalle de una asignatura
      description: Obtiene los detalles completos de una asignatura específica
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID de la asignatura
          example: "697f9c3f1405658893cdb69c"
      responses:
        '200':
          description: Detalle de la asignatura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectPopulated'
        '401':
          description: No autenticado
        '403':
          description: No autorizado
        '404':
          description: Asignatura no encontrada

  /student/grades/summary:
    get:
      tags:
        - Student - Calificaciones
      summary: Resumen de calificaciones del estudiante
      description: Obtiene el resumen de todas las calificaciones agrupadas por asignatura
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resumen de calificaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    subject:
                      $ref: '#/components/schemas/SubjectPopulated'
                    evaluations:
                      type: array
                      items:
                        type: object
                        properties:
                          evaluation:
                            $ref: '#/components/schemas/Evaluation'
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                item:
                                  $ref: '#/components/schemas/EvaluationItem'
                                grade:
                                  type: number
                                  nullable: true
                                  example: 8.5
                          average:
                            type: number
                            nullable: true
                            example: 8.2
                    overall_average:
                      type: number
                      nullable: true
                      example: 8.5
        '401':
          description: No autenticado
        '403':
          description: No autorizado

  /student/attendance:
    get:
      tags:
        - Student - Asistencia
