          content:
            application/json:
              schema:
                type: object
                properties:
                  subjects:
                    type: array
                    items:
                      type: object
                      properties:
                        subjectId:
                          type: string
                          example: "697f9c3f1405658893cdb69c"
                        subjectName:
                          type: string
                          example: "Desarrollo Web Servidor"
                        averageGrade:
                          type: number
                          nullable: true
                          example: 8.5
                        attendancePercentage:
                          type: number
                          example: 85.5
        '401':
          description: No autenticado
        '403':
          description: No autorizado (Solo STUDENT)

  /student/dashboard/progress:
    get:
      tags:
        - Student - Dashboard
      summary: Progreso y logros del estudiante
      description: Obtiene el nivel, progreso y logros recientes del estudiante
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Progreso del estudiante
          content:
            application/json:
              schema:
                type: object
                properties:
                  level:
                    type: integer
                    example: 2
                    description: Nivel del estudiante (achievements / 2 + 1)
                  totalAchievements:
                    type: integer
                    example: 3
                  progress:
                    type: number
                    example: 50
                    description: Porcentaje de progreso hacia el siguiente nivel
                  recentAchievements:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: "Primera Evaluación"
                        description:
                          type: string
                          example: "Completaste tu primera evaluación"
                        achievedAt:
                          type: string
                          format: date-time
        '401':
          description: No autenticado
        '403':
          description: No autorizado

