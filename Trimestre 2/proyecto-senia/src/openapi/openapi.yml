        - in: query
          name: endDate
          schema:
            type: string
            format: date
          description: Fecha de fin
          example: "2026-02-28"
      responses:
        '200':
          description: Historial de asistencias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendancePopulated'
        '401':
          description: No autenticado
        '403':
          description: No autorizado

